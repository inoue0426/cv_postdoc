name: Build and Deploy LaTeX CV

on:
  push:
    branches:
      - main
    paths:
      - "ecr-cv.tex"
      - "badges/**"
      - ".github/workflows/latex.yml"
  pull_request:
    paths:
      - "ecr-cv.tex"
      - "badges/**"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Compile ecr-cv.tex
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ecr-cv.tex

      - name: Prepare published CV
        run: |
          mkdir -p _site
          cp ecr-cv.pdf _site/Yoshitaka_Inoue_CV.pdf
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=Yoshitaka_Inoue_CV.pdf">
            <title>Yoshitaka Inoue - CV</title>
          </head>
          <body>
            <p><a href="Yoshitaka_Inoue_CV.pdf">Open Yoshitaka Inoue's CV (PDF)</a></p>
          </body>
          </html>
          EOF

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: _site/Yoshitaka_Inoue_CV.pdf
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
