name: Build LaTeX CV

on:
  push:
    branches:
      - main
    paths:
      - "ecr-cv.tex"
      - "badges/**"
      - ".github/workflows/latex.yml"
  pull_request:
    paths:
      - "ecr-cv.tex"
      - "badges/**"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile ecr-cv.tex
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ecr-cv.tex

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: ecr-cv.pdf
          if-no-files-found: error
